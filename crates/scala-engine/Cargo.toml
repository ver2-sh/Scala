[package]
name = "scala-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22"
flate2.workspace = true
futures-util.workspace = true
fs2.workspace = true
scala-core = { path = "../scala-core" }
regex = "1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
walkdir.workspace = true
zip.workspace = true
rhai = { version = "=1.26.0", features = ["sync", "serde", "no_module", "no_time", "no_float", "no_closure", "no_custom_syntax", "only_i64"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json.workspace = true
