[workspace]
members = [
    "crates/norted-api",
    "crates/norted-core",
    "crates/norted-engine",
    "crates/norted-engine-llama-cpp",
    "crates/norted-engine-q27",
    "crates/norted-server",
    "crates/norted-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.10.1"
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.31"
libc = "0.2.175"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "stream", "rustls-tls"] }
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
unicode-width = "0.2.2"
uuid = { version = "1.18.1", features = ["v4"] }
flate2 = "1.1.2"
fs2 = "0.4.3"
tar = "0.4.44"
tempfile = "3.23.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = "symbols"
